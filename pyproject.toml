[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medsurface"
version = "0.1.0"
description = "Convert medical volumes, fuse binary labelmaps, and extract surface meshes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Kaufmann", email = "david@kaufmann.dev" }]
keywords = ["dicom", "ct", "mri", "stl", "mesh", "marching-cubes", "3d-printing", "medical-imaging"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "numpy>=1.24,<2.5",
  "pydicom>=2.4",
  "SimpleITK>=2.3",
  # FFT correlation and nearest-neighbor registration.
  "scipy>=1.10",
  # Topology-constrained decimation and self-intersection counting.
  "meshlib==3.1.3.297",
  "rich>=14,<15",
  "typer>=0.21,<0.22",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=7.0",
  "ruff>=0.9",
]

[project.scripts]
medsurface = "medsurface.cli:app"

[project.urls]
Homepage = "https://github.com/kaufmann-dev/medsurface"
Issues = "https://github.com/kaufmann-dev/medsurface/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/medsurface"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/medsurface"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
required-version = "==0.11.28"
